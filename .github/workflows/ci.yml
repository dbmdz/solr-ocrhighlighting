on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate_release:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Validate tagged release
        run: python3 ./util/release.py validate-release "${{ github.ref_name }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
          cache: maven
      - name: Build with Maven and run unit tests
        run: mvn -B package
      - name: Create Solr 7/8 JAR
        run: ./util/patch_solr78_bytecode.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: target/*.jar

  integration_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: ./target
      - name: Change permissions on build artifacts
        run: chmod -R a+rw ./target
      - name: Run integration tests
        run: ./integration-tests/run.sh

  publish_docs:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mike==2.2.0
      - name: Deploy versioned documentation
        run: |
          git config user.name mkdocs-mike
          git config user.email mkdocs-mike@nowhere.tld
          git fetch origin gh-pages
          mike deploy --push --update-aliases ${{ github.ref_name }} latest
          mike set-default --push latest

  release:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - integration_tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: ./target
      - name: Generate release notes
        run: python3 ./util/release.py extract-changelog "${{ github.ref_name }}" > ./release-notes.md
      - uses: ncipollo/release-action@v1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          bodyFile: ./release-notes.md
          artifacts: target/solr-ocrhighlighting-${{ github.ref_name }}.jar,target/solr-ocrhighlighting-${{ github.ref_name }}-solr78.jar
          artifactErrorsFailBuild: true
          allowUpdates: true

  update_plugin_repository:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - publish_docs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: sudo apt-get install -y openssl git
      - name: Update repository
        run: |
          git config --global user.name gh-actions
          git config --global user.email ocrhl-gh-actions@nowhere.tld
          python3 ./util/release.py update-repo
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}

  bump_next_snapshot:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - update_plugin_repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Bump version to next snapshot
        run: python3 ./util/release.py bump-snapshot "${{ github.ref_name }}"
      - name: Open version bump pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          base: main
          branch: automation/bump-${{ github.ref_name }}-snapshot
          delete-branch: true
          add-paths: pom.xml
          commit-message: "chore: bump version to next snapshot"
          title: "chore: bump version to next snapshot"
          body: "Automated snapshot version bump after release ${{ github.ref_name }}."
